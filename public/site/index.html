
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Protected Website</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b0d12;
      color: #e8ecf4;
      font-family: system-ui, sans-serif;
    }

    main {
      width: min(90%, 480px);
      padding: 36px;
      background: #11151d;
      border: 1px solid #263044;
      border-radius: 18px;
      text-align: center;
    }

    .check {
      color: #2ecc71;
      font-size: 48px;
    }

    p { color: #8b96a8; }
  </style>
</head>
<body>
  <main>
    <div class="check">✓</div>
    <h1>Welcome inside!</h1>
    <p>Your admission has been verified by the server.</p>
    <p>This is your protected website.</p>
  </main>
</body>
</html>
